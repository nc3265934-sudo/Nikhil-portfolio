  function findCardsForKey(root, keys){
    const results = [];
    const all = root.querySelectorAll('*');
    // First pass: text nodes via elements
    all.forEach(function(el){
      if (el.dataset && el.dataset.contactEnhanced) return;
      const txt = (el.textContent||'').trim();
      if (!txt) return;
      if (txt.length > 500) return; // too large, likely whole section
      const low = txt.toLowerCase();
      for (let k of keys) {
        if (low.includes(k.toLowerCase()) || txt.includes(k)) {

          // If element has many children and text is large, skip and look for child
          // Find best card: climb up max 3 levels while text length stays similar
          let card = el;
          // If this element is just text wrapper span, go up
          for (let d=0; d<3; d++) {
            const parent = card.parentElement;
            if (!parent) break;
            if (parent === root) break;
            const parentText = (parent.textContent||'').trim();
            if (parentText.length <= txt.length + 80 && parentText.length < 300) {

          if (card.textContent.trim().length > 400) continue;
          results.push(card);

  }

      cards.forEach(function(card){
        if (isAlreadyEnhanced(card)) return;
        const txt = (card.textContent||'').toLowerCase();
